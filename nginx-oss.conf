# /etc/nginx/sites-available/oss.eburon.ai
# Then: sudo ln -s /etc/nginx/sites-available/oss.eburon.ai /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name oss.eburon.ai;

    # For Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name oss.eburon.ai;

    # SSL will be managed by certbot
    ssl_certificate /etc/letsencrypt/live/oss.eburon.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oss.eburon.ai/privkey.pem;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Proxy to the Node app on port 5555
    location / {
        proxy_pass http://localhost:5555;
        proxy_http_version 1.1;

        # Important for WebSocket /live
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for voice streaming
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}